<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossiê DP — Controle Operacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F7F7F4;
  --panel:#FFFFFF;
  --ink:#1C2333;
  --ink-soft:#5A6274;
  --line:#E1E1DC;
  --line-soft:#EDEDE8;
  --teal:#2D5F5D;
  --teal-dark:#1F4645;
  --teal-tint:#E7F0EF;
  --brick:#B23A48;
  --brick-tint:#FBEBEC;
  --amber:#A9701F;
  --amber-tint:#FBF1E1;
  --green:#3F7D5C;
  --green-tint:#EAF3EC;
  --slate:#7C8496;
  --slate-tint:#F0F0EE;
  --radius:3px;
  --font-ui: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
a{color:var(--teal);}
::selection{background:var(--teal-tint);}

/* Layout */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:232px;
  flex-shrink:0;
  background:var(--ink);
  color:#E7E9EE;
  padding:22px 0;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  padding:0 20px 20px 20px;
  border-bottom:1px solid rgba(255,255,255,.1);
  margin-bottom:14px;
}
.brand-mark{font-size:11px;letter-spacing:.06em;color:#9AA3B8;margin-bottom:3px;}
.brand-title{font-size:17px;font-weight:600;color:#fff;}
nav.mainnav{flex:1;overflow-y:auto;}
.navgroup-label{
  font-size:10.5px;color:#7B8298;padding:14px 20px 6px 20px;letter-spacing:.03em;
}
.navitem{
  display:flex;align-items:center;gap:10px;
  padding:9px 20px;
  cursor:pointer;
  color:#C7CCDA;
  font-size:13.5px;
  border-left:3px solid transparent;
}
.navitem:hover{background:rgba(255,255,255,.05);color:#fff;}
.navitem.active{
  background:rgba(255,255,255,.07);
  color:#fff;
  border-left-color:var(--teal);
  font-weight:500;
}
.navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--brick);flex-shrink:0;display:none;}
.navitem .dot.show{display:inline-block;}
.sidebar-foot{padding:14px 20px 4px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:#7B8298;}

main{flex:1;min-width:0;padding:30px 38px 60px 38px;max-width:1180px;}

/* Header */
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:20px;flex-wrap:wrap;}
.pagehead h1{font-size:22px;margin:0 0 4px 0;font-weight:600;}
.pagehead .sub{color:var(--ink-soft);font-size:13.5px;}
.crumb{font-size:12.5px;color:var(--slate);margin-bottom:6px;}
.crumb span{cursor:pointer;color:var(--teal);}
.crumb span:hover{text-decoration:underline;}

/* Buttons */
.btn{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  padding:8px 14px;
  border-radius:var(--radius);
  font-size:13px;
  cursor:pointer;
  font-weight:500;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--ink-soft);}
.btn-primary{background:var(--teal);color:#fff;border-color:var(--teal);}
.btn-primary:hover{background:var(--teal-dark);border-color:var(--teal-dark);}
.btn-danger{color:var(--brick);border-color:var(--brick);background:var(--brick-tint);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-ghost{border-color:transparent;background:transparent;padding:6px 8px;}
.btn-ghost:hover{background:var(--slate-tint);}

/* Cards / grid */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.stat-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 16px 14px 16px;
  cursor:pointer;
}
.stat-card:hover{border-color:var(--ink-soft);}
.stat-card .num{font-family:var(--font-mono);font-size:26px;font-weight:600;line-height:1;}
.stat-card .lbl{color:var(--ink-soft);font-size:12.5px;margin-top:7px;}
.stat-card.flag .num{color:var(--brick);}
.stat-card.ok .num{color:var(--teal);}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px 20px;
  margin-bottom:16px;
}
.panel h2{font-size:14.5px;margin:0 0 12px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
.panel h2 .btn{font-weight:500;}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;
  font-weight:500;
  color:var(--ink-soft);
  font-size:11.5px;
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
td{
  padding:9px 10px;
  border-bottom:1px solid var(--line-soft);
  vertical-align:middle;
}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:var(--slate-tint);}
.mono{font-family:var(--font-mono);}
.tnum{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.empty-row td{color:var(--slate);font-style:italic;text-align:center;padding:22px;}

/* Badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;
  white-space:nowrap;
}
.badge-ativo{background:var(--green-tint);color:var(--green);}
.badge-desligado{background:var(--slate-tint);color:var(--slate);}
.badge-pendente{background:var(--amber-tint);color:var(--amber);}
.badge-conferido{background:#E4EEF7;color:#2A5F8A;}
.badge-lancado{background:#EFE7F5;color:#6A3F92;}
.badge-finalizado{background:var(--green-tint);color:var(--green);}
.badge-urgente{background:var(--brick-tint);color:var(--brick);}
.badge-neutro{background:var(--slate-tint);color:var(--ink-soft);}

/* Filters bar */
.filterbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filterbar input[type=text], .filterbar select{
  border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:13px;font-family:inherit;background:#fff;
}
.filterbar input[type=text]{min-width:200px;}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
.tab{
  padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink-soft);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:600;}

/* Forms */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
.formgrid.full, .field.full{grid-column:1/-1;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
.field input, .field select, .field textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--teal-tint);border-color:var(--teal);}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,24,34,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow-y:auto;z-index:100;
}
.modal{
  background:#fff;border-radius:6px;width:100%;max-width:620px;padding:24px 26px 22px 26px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.modal h3{margin:0 0 16px 0;font-size:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.modal.wide{max-width:820px;}

/* Checklist */
.checklist{list-style:none;margin:0;padding:0;}
.checklist li{
  display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);
}
.checklist li:last-child{border-bottom:none;}
.checklist input[type=checkbox]{width:16px;height:16px;accent-color:var(--teal);flex-shrink:0;}
.checklist .cl-label{flex:1;font-size:13.5px;}
.checklist li.done .cl-label{color:var(--slate);text-decoration:line-through;}
.checklist-progress{height:5px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-bottom:14px;}
.checklist-progress-bar{height:100%;background:var(--teal);}

/* Employee/company detail header */
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px;flex-wrap:wrap;}
.detail-title{font-size:20px;font-weight:600;}
.detail-meta{color:var(--ink-soft);font-size:13px;margin-top:3px;}

.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
@media(max-width:920px){.two-col{grid-template-columns:1fr;}}

.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:13.5px;}
.kv dt{color:var(--ink-soft);}
.kv dd{margin:0;}

.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px;}
.timeline li{padding:0 0 16px 18px;position:relative;}
.timeline li::before{content:'';position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid #fff;}
.timeline .tdate{font-family:var(--font-mono);font-size:11.5px;color:var(--slate);}
.timeline .tdesc{font-size:13.5px;margin-top:2px;}

.hint{color:var(--slate);font-size:12.5px;margin-top:2px;}
.divider{height:1px;background:var(--line);margin:16px 0;}
.section-title{font-size:12px;text-transform:none;color:var(--ink-soft);font-weight:600;margin:0 0 10px 0;letter-spacing:.01em;}
.toast{
  position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--radius);
  font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;
}
.doc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
.doc-row:last-child{border-bottom:none;}
.doc-icon{width:26px;height:26px;border-radius:4px;background:var(--slate-tint);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-soft);flex-shrink:0;}
.linklike{color:var(--teal);cursor:pointer;font-weight:500;}
.linklike:hover{text-decoration:underline;}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--slate);font-size:14px;padding:4px;}
.icon-btn:hover{color:var(--brick);}
</style>
</head>

/* Benefícios de valor variável lançados manualmente na folha, mês a mês */
const EXTRA_BENEFITS = [
  {key:'reembolsoFaculdade', label:'Reembolso Faculdade 50%', obsAllowed:true},
  {key:'produtividade', label:'Produtividade', obsAllowed:false},
  {key:'ajudaCusto', label:'Ajuda de Custo', obsAllowed:false}
];
function ensureEmployeeShape(f){
  if(!f.beneficios) f.beneficios = {};
  EXTRA_BENEFITS.forEach(cfg=>{
    if(!f.beneficios[cfg.key]) f.beneficios[cfg.key] = {recebe:false, valor:0, obs:'', historico:[]};
  });
  return f;
}

let DATA;
DATA = loadData();
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      (parsed.empregados||[]).forEach(ensureEmployeeShape);
      return parsed;
    }
  }catch(e){}
  const seed = seedData();
  seed.empregados.forEach(ensureEmployeeShape);
  saveData(seed);
  return seed;
}
function saveData(d){
  DATA = d;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }catch(e){}
}
function persist(){ saveData(DATA); }
function newId(prefix){ DATA.nextId++; return prefix+DATA.nextId; }

function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(v){ v = Number(v)||0; return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function dateBR(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function competenciaBR(c){ if(!c) return '—'; const [y,m]=c.split('-'); const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return `${meses[parseInt(m,10)-1]}/${y}`; }
function empresaById(id){ return DATA.empresas.find(e=>e.id===id); }
function empregadoById(id){ return DATA.empregados.find(f=>f.id===id); }
function socioById(id){ return DATA.socios.find(s=>s.id===id); }
function empregadosDe(empresaId){ return DATA.empregados.filter(f=>f.empresaId===empresaId); }
function sociosDe(empresaId){ return DATA.socios.filter(s=>s.empresaId===empresaId); }
function movimentacoesDe(empresaId){ return DATA.movimentacoes.filter(m=>m.empresaId===empresaId); }
function statusBadgeClass(status){
  const map = {'Ativo':'ativo','Ativa':'ativo','Desligado':'desligado','Pendente':'pendente','Conferido':'conferido','Lançado':'lancado','Finalizado':'finalizado','Urgente':'urgente','Aberta':'pendente','Pago':'finalizado','Confirmada':'finalizado','Confirmado':'finalizado'};
  return 'badge-'+(map[status]||'neutro');
}
function badge(status){ return `<span class="badge ${statusBadgeClass(status)}">${esc(status)}</span>`; }
function isCurrentComp(c){ return c===DATA.meta.competenciaAtual; }
function daysUntil(iso){ const d=new Date(iso+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function normalizeLabel(v){ return String(v||'').trim().toLowerCase(); }
function hasMovimentacaoThisComp(empregadoId, tipoLabel){
  return DATA.movimentacoes.some(m=> m.empregadoId===empregadoId && isCurrentComp(m.competencia) && normalizeLabel(m.tipo)===normalizeLabel(tipoLabel));
}
function hasDistribuicaoThisComp(socioId){
  return DATA.distribuicoes.some(d=> d.socioId===socioId && isCurrentComp(d.competencia));
}
function launchBenefFolha(empregadoId, key){
  const f = empregadoById(empregadoId);
  const cfg = EXTRA_BENEFITS.find(b=>b.key===key);
  if(!f || !cfg) return;
  const valor = (f.beneficios[key] && f.beneficios[key].valor) || 0;
  DATA.movimentacoes.push({id:newId('m'), empregadoId, empresaId:f.empresaId, tipo:cfg.label, valor, competencia:DATA.meta.competenciaAtual, status:'Pendente'});
  persist();

  render();
}
function launchDistribuicaoLucro(socioId){

  DATA.distribuicoes.push({id:newId('d'), socioId, competencia:DATA.meta.competenciaAtual, valor:0, status:'Pendente'});

}
function toast(msg){

  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

/* Central pendency computation (derived + manual) */
function computePendencias(){
  const list = [];
  DATA.empregados.forEach(f=>{
    const emp = empresaById(f.empresaId);
    if(f.status==='Desligado'){
      const ativos = [];
      if(f.beneficios.unimedSaude.contratado && !/exclu[íi]da|encerrad/i.test(f.beneficios.unimedSaude.status)) ativos.push('Unimed Saúde');
      if(f.beneficios.unimedOdonto.contratado && !/exclu[íi]da|encerrad/i.test(f.beneficios.unimedOdonto.status)) ativos.push('Unimed Odonto');
      if(f.beneficios.va.recebe && f.beneficios.va.status!=='Encerrado') ativos.push('Vale-alimentação');
      if(ativos.length){
        list.push({id:'auto-desl-'+f.id, empresaId:f.empresaId, empregadoId:f.id, tipo:'Desligado com benefício ativo', descricao:`${f.nome} (${emp?emp.nomeFantasia:''}) segue com ${ativos.join(', ')} ativo(s) após desligamento.`, prazo:f.desligamentoData, status:'Urgente', auto:true});
      }
    }
    if(f.checklistAdmissao && !Object.values(f.checklistAdmissao).every(v=>v)){
      const pend = Object.entries(f.checklistAdmissao).filter(([k,v])=>!v).map(([k])=>k);
      list.push({id:'auto-adm-'+f.id, empresaId:f.empresaId, empregadoId:f.id, tipo:'Admissão com pendência', descricao:`${f.nome}: checklist de admissão incompleto (${pend.length} etapa${pend.length>1?'s':''} pendente${pend.length>1?'s':''}).`, prazo:f.admissao, status:'Aberta', auto:true});
    }
    if(f.checklistDesligamento && !Object.values(f.checklistDesligamento).every(v=>v)){
      const pend = Object.entries(f.checklistDesligamento).filter(([k,v])=>!v).map(([k])=>k);
      list.push({id:'auto-desl2-'+f.id, empresaId:f.empresaId, empregadoId:f.id, tipo:'Desligamento com pendência', descricao:`${f.nome}: checklist de desligamento incompleto (${pend.join(', ')}).`, prazo:f.desligamentoData, status:'Urgente', auto:true});
    }
  });
  DATA.movimentacoes.forEach(m=>{
    if(m.status==='Pendente' && isCurrentComp(m.competencia)){
      const f = empregadoById(m.empregadoId);
      list.push({id:'auto-mov-'+m.id, empresaId:m.empresaId, empregadoId:m.empregadoId, tipo:'Movimentação não lançada', descricao:`${f?f.nome:'—'}: "${m.tipo}" (${money(m.valor)}) ainda não conferida/lançada.`, prazo:null, status:'Aberta', auto:true});
    }
  });
  DATA.empregados.forEach(f=>{
    if(f.status!=='Ativo') return;
    EXTRA_BENEFITS.forEach(cfg=>{
      const b = f.beneficios[cfg.key];
      if(b && b.recebe && !hasMovimentacaoThisComp(f.id, cfg.label)){
        list.push({id:`auto-folha-${f.id}-${cfg.key}`, empresaId:f.empresaId, empregadoId:f.id, tipo:'Lançamento em folha (dia 01)', descricao:`${f.nome}: lançar "${cfg.label}" (${money(b.valor)}) na folha de pagamento desta competência.`, prazo:`${DATA.meta.competenciaAtual}-01`, status:'Urgente', auto:true, actionType:'folha', actionEmpregadoId:f.id, actionKey:cfg.key});
      }
    });
  });
  DATA.socios.forEach(s=>{
    if(!s.distribuiLucros) return;
    if(!hasDistribuicaoThisComp(s.id)){
      const emp = empresaById(s.empresaId);
      list.push({id:`auto-distlucro-${s.id}`, empresaId:s.empresaId, empregadoId:null, tipo:'Distribuição de lucros (dia 01)', descricao:`${s.nome}${emp?` (${emp.nomeFantasia})`:''}: lançar distribuição de lucros desta competência.`, prazo:`${DATA.meta.competenciaAtual}-01`, status:'Urgente', auto:true, actionType:'distribuicao', actionSocioId:s.id});
    }
  });
  DATA.pendenciasManuais.forEach(p=> list.push(Object.assign({auto:false}, p)));
  return list;
}
function proximasRecargasVT(){
  const list = [];
  DATA.empregados.filter(f=>f.status==='Ativo' && f.beneficios.vt.recebe).forEach(f=>{
    const emp = empresaById(f.empresaId);
    list.push({empregado:f.nome, empresa:emp?emp.nomeFantasia:'', dia:f.beneficios.vt.dataRecarga||1});
  });
  return list;
}

        <div class="field"><label>Dia de pagamento</label><input type="number" min="1" max="31" name="diaPagamento" value="${e?e.diaPagamento:5}"></div>
        <div class="field full"><label>Sindicato / CCT</label><input name="sindicato" value="${esc(e?e.sindicato:'')}"></div>
        <div class="field full"><label>Observações</label><textarea name="observacoes">${esc(e?e.observacoes:'')}</textarea></div>

  `);
}
function saveEmpresa(ev,id){
  ev.preventDefault();
  const f = new FormData(ev.target);
  const vals = Object.fromEntries(f.entries());
  vals.diaPagamento = parseInt(vals.diaPagamento,10)||5;
  if(id){
    Object.assign(empresaById(id), vals);
  }else{
    DATA.empresas.push(Object.assign({id:newId('e'), regras:{particularidades:'',beneficios:[],datasImportantes:'',formaPagamento:'',regrasEspecificas:''}}, vals));
  }
  persist(); closeModal(); toast('Empresa salva.'); render();
  return false;
}

function deleteEmpresa(id){
  const e = empresaById(id);
  if(!e) return;
  const empCount = empregadosDe(id).length;
  const socioIds = sociosDe(id).map(s=>s.id);
  const socCount = socioIds.length;
  const distCount = DATA.distribuicoes.filter(d=>socioIds.includes(d.socioId)).length;
  const movCount = movimentacoesDe(id).length;
  const docCount = DATA.documentosEmpresa.filter(d=>d.empresaId===id).length;
  const partes = [];
  if(empCount) partes.push(`${empCount} empregado(s)`);
  if(socCount) partes.push(`${socCount} sócio(s)`);
  if(distCount) partes.push(`${distCount} distribuição(ões) de lucro`);
  if(movCount) partes.push(`${movCount} movimentação(ões)`);
  if(docCount) partes.push(`${docCount} documento(s)`);
  const aviso = partes.length ? ` Isso também excluirá: ${partes.join(', ')}.` : '';
  if(!confirm(`Excluir a empresa "${e.nomeFantasia}"?${aviso} Esta ação não pode ser desfeita.`)) return;
  DATA.empregados = DATA.empregados.filter(f=>f.empresaId!==id);
  DATA.socios = DATA.socios.filter(s=>s.empresaId!==id);
  DATA.distribuicoes = DATA.distribuicoes.filter(d=>!socioIds.includes(d.socioId));
  DATA.movimentacoes = DATA.movimentacoes.filter(m=>m.empresaId!==id);
  DATA.documentosEmpresa = DATA.documentosEmpresa.filter(d=>d.empresaId!==id);
  DATA.pendenciasManuais = DATA.pendenciasManuais.filter(p=>p.empresaId!==id);
  DATA.empresas = DATA.empresas.filter(x=>x.id!==id);
  persist();
  toast('Empresa e registros vinculados excluídos.');
  go('empresas');
}

let PENDING_IMPORT = null;

function openModalImportar(){
  showModal(`
    <h3>Importar empresas e empregados via planilha</h3>
    <p class="hint">Envie o arquivo preenchido a partir do modelo (abas "Empresas" e "Empregados"). Aceita .xlsx e .csv. Empresas são identificadas pelo CNPJ; empregados, pelo nome dentro de cada empresa — registros já existentes são atualizados, não duplicados.</p>

      <input type="file" id="importFileInput" accept=".xlsx,.xls,.csv" onchange="handleImportFile(this)">
    </div>

    <div class="modal-actions">
      <button type="button" class="btn" onclick="closeModal()">Cancelar</button>

    </div>

function normalizeHeader(h){
  return String(h||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\(.*?\)/g,'')
    .replace(/[\*\?]/g,'')
    .replace(/\s+/g,' ')
    .trim().toLowerCase();
}
const IMPORT_HEADER_MAP_EMPRESA = {
  'razao social': 'razaoSocial',
  'nome fantasia': 'nomeFantasia',
  'cnpj': 'cnpj',
  'responsavel': 'responsavel',
  'dia de pagamento': 'diaPagamento',
  'sindicato / cct': 'sindicato',
  'sindicato/cct': 'sindicato',
  'observacoes': 'observacoes',
  'beneficios oferecidos': 'beneficios',
  'particularidades da folha': 'particularidades',
  'datas importantes': 'datasImportantes',
  'forma de pagamento': 'formaPagamento',
  'regras especificas': 'regrasEspecificas'
};
const IMPORT_HEADER_MAP_EMPREGADO = {
  'cnpj da empresa': 'empresaCnpj',
  'nome completo': 'nome',
  'cargo': 'cargo',
  'data de admissao': 'admissao',
  'salario': 'salario',
  'status': 'status',
  'recebe vt': 'recebeVt',
  'dia de recarga vt': 'diaRecargaVt',
  'recebe va': 'recebeVa',
  'valor va': 'valorVa',
  'unimed saude': 'unimedSaude',
  'unimed odonto': 'unimedOdonto'
};
function normalizeCnpj(v){ return String(v||'').replace(/[^\d]/g,''); }
function normalizeName(v){ return String(v||'').trim().toLowerCase().replace(/\s+/g,' '); }
function parseSimNao(v){ return /^s(im)?$/i.test(String(v||'').trim()); }
function parseNumberFlexible(v){
  if(typeof v === 'number') return v;
  let s = String(v||'').trim();
  if(!s) return 0;
  if(/,\d{1,2}$/.test(s)) s = s.replace(/\./g,'').replace(',', '.');
  else s = s.replace(/,/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function excelDateToISO(v){
  if(v instanceof Date){
    const y=v.getUTCFullYear(), m=String(v.getUTCMonth()+1).padStart(2,'0'), d=String(v.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v||'').trim();
  if(!s) return '';
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return s;
}

function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    document.getElementById('importPreview').innerHTML = `<p style="color:var(--brick);font-size:13px;">Não foi possível carregar o leitor de planilhas (é necessário estar conectado à internet na primeira vez). Tente novamente ou salve o arquivo como .csv.</p>`;
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const empresaSheet = wb.SheetNames.includes('Empresas') ? 'Empresas' : wb.SheetNames[0];
      const empresaRows = XLSX.utils.sheet_to_json(wb.Sheets[empresaSheet], {defval:''});
      const empresasResult = parseImportEmpresas(empresaRows);

      let empregadosResult = {toCreate:[], toUpdate:[], invalid:[]};
      if(wb.SheetNames.includes('Empregados')){
        const empregadoRows = XLSX.utils.sheet_to_json(wb.Sheets['Empregados'], {defval:''});
        empregadosResult = parseImportEmpregados(empregadoRows, empresasResult.cnpjMap);
      }

      PENDING_IMPORT = {empresas: empresasResult, empregados: empregadosResult};
      renderImportPreview();
    }catch(err){
      document.getElementById('importPreview').innerHTML = `<p style="color:var(--brick);font-size:13px;">Não foi possível ler o arquivo. Verifique se é um .xlsx ou .csv válido, gerado a partir do modelo.</p>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseImportEmpresas(rows){
  const results = {toCreate:[], toUpdate:[], invalid:[]};
  const exampleCnpj = normalizeCnpj('00.000.000/0001-00');
  // cnpjMap: normalized CNPJ -> {type:'existing', id} | {type:'new', ref: entryObject}
  const cnpjMap = {};
  DATA.empresas.forEach(e=> cnpjMap[normalizeCnpj(e.cnpj)] = {type:'existing', id:e.id});

  rows.forEach((row,idx)=>{
    const mapped = {};
    Object.keys(row).forEach(k=>{
      const field = IMPORT_HEADER_MAP_EMPRESA[normalizeHeader(k)];
      if(field) mapped[field] = row[k];
    });
    const cnpjNorm = normalizeCnpj(mapped.cnpj);
    const hasContent = Object.values(mapped).some(v=>String(v).trim()!=='');
    if(!hasContent) return;
    if(cnpjNorm === exampleCnpj) return;
    if(!mapped.razaoSocial || !mapped.nomeFantasia || !cnpjNorm){
      results.invalid.push({row: idx+2, motivo:'Faltam campos obrigatórios (Razão Social, Nome Fantasia ou CNPJ).'});
      return;
    }
    const existing = DATA.empresas.find(e=> normalizeCnpj(e.cnpj) === cnpjNorm);
    const entry = {
      razaoSocial: String(mapped.razaoSocial).trim(),
      nomeFantasia: String(mapped.nomeFantasia).trim(),
      cnpj: String(mapped.cnpj).trim(),
      responsavel: String(mapped.responsavel||'').trim(),
      diaPagamento: parseInt(parseNumberFlexible(mapped.diaPagamento),10) || (existing?existing.diaPagamento:5),
      sindicato: String(mapped.sindicato||'').trim(),
      observacoes: String(mapped.observacoes||'').trim(),
      regras: {
        beneficios: String(mapped.beneficios||'').split(',').map(s=>s.trim()).filter(Boolean),
        particularidades: String(mapped.particularidades||'').trim(),
        datasImportantes: String(mapped.datasImportantes||'').trim(),
        formaPagamento: String(mapped.formaPagamento||'').trim(),
        regrasEspecificas: String(mapped.regrasEspecificas||'').trim()
      }
    };
    if(existing){
      results.toUpdate.push({existing, entry});
      cnpjMap[cnpjNorm] = {type:'existing', id: existing.id};
    }else{
      results.toCreate.push(entry);
      cnpjMap[cnpjNorm] = {type:'new', ref: entry};
    }
  });
  results.cnpjMap = cnpjMap;
  return results;
}

function parseImportEmpregados(rows, cnpjMap){
  const results = {toCreate:[], toUpdate:[], invalid:[]};
  const exampleCnpj = normalizeCnpj('00.000.000/0001-00');
  rows.forEach((row,idx)=>{
    const mapped = {};
    Object.keys(row).forEach(k=>{
      const field = IMPORT_HEADER_MAP_EMPREGADO[normalizeHeader(k)];
      if(field) mapped[field] = row[k];
    });
    const cnpjNorm = normalizeCnpj(mapped.empresaCnpj);
    const hasContent = Object.values(mapped).some(v=>String(v).trim()!=='');
    if(!hasContent) return;
    if(cnpjNorm === exampleCnpj) return;
    if(!mapped.nome || !mapped.cargo || !mapped.admissao || cnpjNorm===''){
      results.invalid.push({row: idx+2, motivo:'Faltam campos obrigatórios (CNPJ da Empresa, Nome, Cargo ou Data de Admissão).'});
      return;
    }
    const companyRef = cnpjMap[cnpjNorm];
    if(!companyRef){
      results.invalid.push({row: idx+2, motivo:`Empresa com CNPJ ${esc(mapped.empresaCnpj)} não encontrada — cadastre-a na aba Empresas primeiro.`});
      return;
    }
    const admissaoISO = excelDateToISO(mapped.admissao);
    const statusNorm = String(mapped.status||'').trim().toLowerCase();
    const status = statusNorm.startsWith('deslig') ? 'Desligado' : 'Ativo';
    const recebeVa = parseSimNao(mapped.recebeVa);
    const valorVa = parseNumberFlexible(mapped.valorVa);
    const unimedSaudeSim = parseSimNao(mapped.unimedSaude);
    const unimedOdontoSim = parseSimNao(mapped.unimedOdonto);
    const entry = {
      nome: String(mapped.nome).trim(),
      cargo: String(mapped.cargo).trim(),
      admissao: admissaoISO,
      salario: parseNumberFlexible(mapped.salario),
      status,
      beneficios: {
        vt: {recebe: parseSimNao(mapped.recebeVt), dataRecarga: parseInt(parseNumberFlexible(mapped.diaRecargaVt),10) || 1},
        va: {recebe: recebeVa, dataInicio: admissaoISO, valor: valorVa, status: recebeVa?'Ativo':'—', obs:'', historico: recebeVa?[{data:admissaoISO, valor:valorVa, evento:'Cadastro inicial importado'}]:[]},
        unimedSaude: {contratado: unimedSaudeSim, status: unimedSaudeSim?'Confirmada':'—'},
        unimedOdonto: {contratado: unimedOdontoSim, status: unimedOdontoSim?'Confirmada':'—'}
      },
      companyRef
    };
    let existingEmp = null;
    if(companyRef.type==='existing'){
      existingEmp = DATA.empregados.find(f=> f.empresaId===companyRef.id && normalizeName(f.nome)===normalizeName(entry.nome));
    }
    if(existingEmp) results.toUpdate.push({existing: existingEmp, entry});
    else results.toCreate.push(entry);
  });
  return results;
}

function renderImportPreview(){
  const p = PENDING_IMPORT;
  const box = document.getElementById('importPreview');
  const eTotal = p.empresas.toCreate.length + p.empresas.toUpdate.length;
  const fTotal = p.empregados.toCreate.length + p.empregados.toUpdate.length;
  const invalidTotal = p.empresas.invalid.length + p.empregados.invalid.length;
  let html = `<div class="panel" style="margin-bottom:10px;">`;
  html += `<div class="section-title">Empresas</div>`;
  html += `<p style="font-size:13.5px;margin:0 0 8px 0;"><strong>${p.empresas.toCreate.length}</strong> nova(s) · <strong>${p.empresas.toUpdate.length}</strong> atualização(ões)${p.empresas.invalid.length?` · <span style="color:var(--brick)">${p.empresas.invalid.length} linha(s) inválida(s)</span>`:''}</p>`;
  if(eTotal>0){
    html += `<ul class="checklist" style="border-top:1px solid var(--line-soft);max-height:150px;overflow-y:auto;">`;
    p.empresas.toCreate.forEach(e=> html += `<li><span class="cl-label">${esc(e.nomeFantasia)}</span><span class="badge badge-finalizado">Nova</span></li>`);

    html += `</ul>`;
  }
  if(p.empresas.invalid.length) html += `<p class="hint" style="color:var(--brick);margin-top:8px;">Linhas ignoradas: ${p.empresas.invalid.map(i=>`linha ${i.row}`).join(', ')} — ${esc(p.empresas.invalid[0].motivo)}</p>`;
  html += `</div>`;

  html += `<div class="panel" style="margin-bottom:0;">`;
  html += `<div class="section-title">Empregados</div>`;
  html += `<p style="font-size:13.5px;margin:0 0 8px 0;"><strong>${p.empregados.toCreate.length}</strong> novo(s) · <strong>${p.empregados.toUpdate.length}</strong> atualização(ões)${p.empregados.invalid.length?` · <span style="color:var(--brick)">${p.empregados.invalid.length} linha(s) inválida(s)</span>`:''}</p>`;
  if(fTotal>0){
    html += `<ul class="checklist" style="border-top:1px solid var(--line-soft);max-height:150px;overflow-y:auto;">`;
    p.empregados.toCreate.forEach(f=> html += `<li><span class="cl-label">${esc(f.nome)}</span><span class="badge badge-finalizado">Novo</span></li>`);
    p.empregados.toUpdate.forEach(u=> html += `<li><span class="cl-label">${esc(u.entry.nome)}</span><span class="badge badge-pendente">Atualizar</span></li>`);
    html += `</ul>`;
  }
  if(p.empregados.invalid.length) html += `<p class="hint" style="color:var(--brick);margin-top:8px;">Linhas ignoradas: ${p.empregados.invalid.map(i=>`linha ${i.row}`).join(', ')} — ${esc(p.empregados.invalid[0].motivo)}</p>`;
  if(eTotal===0 && fTotal===0 && !invalidTotal) html += `<p class="hint">Nenhuma linha preenchida foi encontrada no arquivo.</p>`;
  html += `</div>`;

  box.innerHTML = html;
  document.getElementById('importConfirmBtn').style.display = (eTotal+fTotal)>0 ? 'inline-flex' : 'none';
}

function confirmImport(){
  if(!PENDING_IMPORT) return;
  const p = PENDING_IMPORT;

  p.empresas.toCreate.forEach(entry=>{
    const created = Object.assign({id:newId('e')}, entry);
    DATA.empresas.push(created);
    entry.companyRef = entry.companyRef || null;
    entry._createdId = created.id;
    if(entry.__cnpjNorm===undefined){} // noop, kept for clarity
  });
  p.empresas.toUpdate.forEach(({existing, entry})=>{ Object.assign(existing, entry); });

  function resolveCompanyId(companyRef){
    if(companyRef.type==='existing') return companyRef.id;
    return companyRef.ref._createdId;
  }

  p.empregados.toCreate.forEach(entry=>{
    const empresaId = resolveCompanyId(entry.companyRef);
    if(!empresaId) return;
    const novo = {
      id:newId('f'), empresaId, nome:entry.nome, cargo:entry.cargo, admissao:entry.admissao, salario:entry.salario, status:entry.status,
      beneficios: entry.beneficios,
      particularidades:{gratificacoesFixas:'',premiosVariaveis:'',observacoes:''},
      checklistAdmissao:{'Cadastro no sistema':true,'Admissão no eSocial':true,'VT verificado':true,'Vale-alimentação verificado':true,'Unimed Saúde verificada':true,'Unimed Saúde solicitada':true,'Unimed Saúde confirmada':true,'Odonto verificado':true,'Odonto solicitado':true,'Odonto confirmado':true,'Descontos cadastrados':true,'Documentação anexada':true,'Processo finalizado':true},
      checklistDesligamento: entry.status==='Desligado' ? {'Rescisão processada':true,'eSocial enviado':true,'VT encerrado':true,'Vale-alimentação encerrado':true,'Exclusões de benefícios':true,'Pagamentos extras revisados':true,'Descontos recorrentes encerrados':true,'Documentação anexada':true,'Processo finalizado':true} : null,
      historico:[{data:entry.admissao, tipo:'Admissão', desc:`Admitido(a) como ${entry.cargo}. Cadastro inicial importado via planilha.`}],
      documentos:[]
    };
    if(entry.status==='Desligado'){
      novo.desligamentoData = new Date().toISOString().slice(0,10);
      novo.historico.push({data:novo.desligamentoData, tipo:'Desligamento', desc:'Status "Desligado" importado via planilha (data de desligamento não informada — ajuste se necessário).'});
    }
    ensureEmployeeShape(novo);
    DATA.empregados.push(novo);
  });
  p.empregados.toUpdate.forEach(({existing, entry})=>{
    existing.cargo = entry.cargo; existing.admissao = entry.admissao; existing.salario = entry.salario; existing.status = entry.status;
    existing.beneficios = Object.assign({}, existing.beneficios, entry.beneficios);
    ensureEmployeeShape(existing);
    existing.historico = existing.historico||[];
    existing.historico.push({data:new Date().toISOString().slice(0,10), tipo:'Atualização', desc:'Dados atualizados via importação de planilha.'});
  });

  persist();
  const summary = `Importação concluída: ${p.empresas.toCreate.length} empresa(s) nova(s), ${p.empresas.toUpdate.length} atualizada(s); ${p.empregados.toCreate.length} empregado(s) novo(s), ${p.empregados.toUpdate.length} atualizado(s).`;
  PENDING_IMPORT = null;
  closeModal();
  toast(summary);
  go('empresas');
}

function saveEmpregado(ev,id,empresaId){
  ev.preventDefault();
  const vals = Object.fromEntries(new FormData(ev.target).entries());
  vals.salario = parseFloat(vals.salario)||0;
  if(id){
    Object.assign(empregadoById(id), vals);
  }else{
    const novo = {
      id:newId('f'), empresaId, ...vals,
      beneficios:{vt:{recebe:false,dataRecarga:1}, va:{recebe:false,dataInicio:vals.admissao,valor:0,status:'—',obs:'',historico:[]}, unimedSaude:{contratado:false,status:'—'}, unimedOdonto:{contratado:false,status:'—'}},
      particularidades:{gratificacoesFixas:'',premiosVariaveis:'',observacoes:''},
      checklistAdmissao:{'Cadastro no sistema':true,'Admissão no eSocial':false,'VT verificado':false,'Vale-alimentação verificado':false,'Unimed Saúde verificada':false,'Unimed Saúde solicitada':false,'Unimed Saúde confirmada':false,'Odonto verificado':false,'Odonto solicitado':false,'Odonto confirmado':false,'Descontos cadastrados':false,'Documentação anexada':false,'Processo finalizado':false},
      checklistDesligamento:null,
      historico:[{data:vals.admissao, tipo:'Admissão', desc:`Admitido(a) como ${vals.cargo}.`}],
      documentos:[]
    };
    ensureEmployeeShape(novo);
    DATA.empregados.push(novo);
  }
  persist(); closeModal(); toast('Empregado salvo.'); render();
  return false;
}

function deleteEmpregado(id){
  const f = empregadoById(id);
  if(!f) return;
  const movCount = DATA.movimentacoes.filter(m=>m.empregadoId===id).length;
  const aviso = movCount ? ` Isso também excluirá ${movCount} movimentação(ões) vinculada(s).` : '';
  if(!confirm(`Excluir o cadastro de ${f.nome}?${aviso} Esta ação não pode ser desfeita.`)) return;
  const empresaId = f.empresaId;
  DATA.movimentacoes = DATA.movimentacoes.filter(m=>m.empregadoId!==id);
  DATA.pendenciasManuais = DATA.pendenciasManuais.filter(p=>p.empregadoId!==id);
  DATA.empregados = DATA.empregados.filter(x=>x.id!==id);
  persist();
  toast('Empregado excluído.');
  go('empresaDetail',{empresaId, empresaTab:'pessoas'});
}

function startDesligamento(id){
  const f = empregadoById(id);
  if(!confirm(`Confirmar desligamento de ${f.nome}? O histórico será mantido — apenas o status muda para Desligado.`)) return;
  const today = new Date().toISOString().slice(0,10);
  f.status = 'Desligado';
  f.desligamentoData = today;
  f.checklistDesligamento = {'Rescisão processada':false,'eSocial enviado':false,'VT encerrado':false,'Vale-alimentação encerrado':false,'Exclusões de benefícios':false,'Pagamentos extras revisados':false,'Descontos recorrentes encerrados':false,'Documentação anexada':false,'Processo finalizado':false};
  f.historico = f.historico||[];
  f.historico.push({data:today, tipo:'Desligamento', desc:'Desligamento registrado. Checklist de desligamento iniciado.'});
  persist(); toast('Desligamento registrado. Histórico preservado.'); go('empregadoDetail',{empregadoId:id,empresaId:f.empresaId,empregadoTab:'checklist'});
}

function updVtRecebe(id,v){ empregadoById(id).beneficios.vt.recebe = v==='sim'; persist(); refreshEmpTab(id); }

function updVaRecebe(id,v){ empregadoById(id).beneficios.va.recebe = v==='sim'; persist(); refreshEmpTab(id); }
function updVaValor(id,v){
  const f = empregadoById(id); const novo = parseFloat(v)||0;
  if(novo !== f.beneficios.va.valor){
    f.beneficios.va.historico = f.beneficios.va.historico||[];
    f.beneficios.va.historico.push({data:new Date().toISOString().slice(0,10), valor:novo, evento:'Alteração manual de valor'});
  }
  f.beneficios.va.valor = novo; persist(); refreshEmpTab(id);
}
function updVaObs(id,v){ empregadoById(id).beneficios.va.obs = v; persist(); }
function updBenefFlow(id,key,v){
  const f = empregadoById(id);
  f.beneficios[key].status = v;
  f.beneficios[key].contratado = v !== '—';
  persist(); toast('Status do benefício atualizado.'); refreshEmpTab(id);
}
function updExtraBenefRecebe(id,key,v){
  empregadoById(id).beneficios[key].recebe = v==='sim';

}
function updExtraBenefValor(id,key,v){
  const f = empregadoById(id); const b = f.beneficios[key]; const novo = parseFloat(v)||0;
  if(novo !== b.valor){
    b.historico = b.historico||[];
    b.historico.push({data:new Date().toISOString().slice(0,10), valor:novo, evento:'Alteração manual de valor'});

  b.valor = novo; persist(); refreshEmpTab(id);
}

function deleteSocio(id, redirectEmpresaId){
  const s = socioById(id);
  if(!s) return;
  const distCount = DATA.distribuicoes.filter(d=>d.socioId===id).length;
  const aviso = distCount ? ` Isso também excluirá ${distCount} distribuição(ões) de lucro vinculada(s).` : '';
  if(!confirm(`Excluir o cadastro de ${s.nome}?${aviso} Esta ação não pode ser desfeita.`)) return;
  DATA.distribuicoes = DATA.distribuicoes.filter(d=>d.socioId!==id);
  DATA.socios = DATA.socios.filter(x=>x.id!==id);
  persist();
  toast('Sócio excluído.');
  if(redirectEmpresaId) go('empresaDetail',{empresaId:redirectEmpresaId, empresaTab:'pessoas'});
  else go('socios');
}

  const emps = DATA.empregados;
  const inclusoes = emps.filter(f=>f.status==='Ativo' && ((f.beneficios.unimedSaude.contratado && !/confirmad/i.test(f.beneficios.unimedSaude.status)) || (f.beneficios.unimedOdonto.contratado && !/confirmad/i.test(f.beneficios.unimedOdonto.status))));
  const exclusoes = emps.filter(f=>f.status==='Desligado' && ((f.beneficios.unimedSaude.contratado && !/exclu[íi]da|encerrad/i.test(f.beneficios.unimedSaude.status)) || (f.beneficios.unimedOdonto.contratado && !/exclu[íi]da|encerrad/i.test(f.beneficios.unimedOdonto.status))));
  const vtAtivos = emps.filter(f=>f.status==='Ativo' && f.beneficios.vt.recebe);
  const vaAtivos = emps.filter(f=>f.status==='Ativo' && f.beneficios.va.recebe);

  return `
    <div class="pagehead"><div><h1>Gestão de benefícios</h1><div class="sub">Fluxo de inclusão e exclusão em todas as empresas.</div></div></div>
    <div class="grid grid-3" style="margin-bottom:16px;">
      <div class="stat-card ${exclusoes.length?'flag':''}" onclick="void(0)"><div class="num">${exclusoes.length}</div><div class="lbl">Exclusões pendentes (desligados)</div></div>
      <div class="stat-card ${inclusoes.length?'flag':''}"><div class="num">${inclusoes.length}</div><div class="lbl">Inclusões em andamento</div></div>
      <div class="stat-card ok"><div class="num">${vtAtivos.length}</div><div class="lbl">VT ativos · ${vaAtivos.length} VA ativos</div></div>
    </div>

    ${exclusoes.length?`
    <div class="panel">
      <h2>⚠ Exclusões críticas — desligados com benefício ainda ativo</h2>
      <table><thead><tr><th>Empregado</th><th>Empresa</th><th>Desligamento</th><th>Unimed Saúde</th><th>Unimed Odonto</th></tr></thead><tbody>
      ${exclusoes.map(f=>{
        const e=empresaById(f.empresaId);
        return `<tr class="clickable" onclick="go('empregadoDetail',{empregadoId:'${f.id}',empresaId:'${e.id}',empregadoTab:'beneficios'})">
          <td>${esc(f.nome)}</td><td>${esc(e.nomeFantasia)}</td><td class="mono">${dateBR(f.desligamentoData)}</td>
          <td>${benefFlowBadge(f.beneficios.unimedSaude)}</td><td>${benefFlowBadge(f.beneficios.unimedOdonto)}</td>
        </tr>`;
      }).join('')}
      </tbody></table>
    </div>`:''}

    <div class="panel">
      <h2>Inclusões em andamento</h2>
      ${inclusoes.length===0?'<p class="hint">Nenhuma inclusão pendente.</p>':`
      <table><thead><tr><th>Empregado</th><th>Empresa</th><th>Unimed Saúde</th><th>Unimed Odonto</th></tr></thead><tbody>
      ${inclusoes.map(f=>{
        const e=empresaById(f.empresaId);
        return `<tr class="clickable" onclick="go('empregadoDetail',{empregadoId:'${f.id}',empresaId:'${e.id}',empregadoTab:'beneficios'})">
          <td>${esc(f.nome)}</td><td>${esc(e.nomeFantasia)}</td>
          <td>${benefFlowBadge(f.beneficios.unimedSaude)}</td><td>${benefFlowBadge(f.beneficios.unimedOdonto)}</td>
        </tr>`;
      }).join('')}
      </tbody></table>`}
    </div>

    <div class="two-col">
      <div class="panel">
        <h2>Vale-transporte — ativos</h2>
        <table><thead><tr><th>Empregado</th><th>Empresa</th><th>Recarga</th></tr></thead><tbody>
        ${vtAtivos.map(f=>`<tr><td>${esc(f.nome)}</td><td>${esc(empresaById(f.empresaId).nomeFantasia)}</td><td class="mono">dia ${f.beneficios.vt.dataRecarga}</td></tr>`).join('') || `<tr class="empty-row"><td colspan="3">Nenhum.</td></tr>`}
        </tbody></table>
      </div>
      <div class="panel">
        <h2>Vale-alimentação — ativos</h2>
        <table><thead><tr><th>Empregado</th><th>Empresa</th><th>Valor</th></tr></thead><tbody>
        ${vaAtivos.map(f=>`<tr><td>${esc(f.nome)}</td><td>${esc(empresaById(f.empresaId).nomeFantasia)}</td><td class="tnum">${money(f.beneficios.va.valor)}</td></tr>`).join('') || `<tr class="empty-row"><td colspan="3">Nenhum.</td></tr>`}
        </tbody></table>
      </div>
    </div>
  `;
}

/* ============================= PENDÊNCIAS ============================= */
function viewPendencias(){
  const filtroEmpresa = VIEW.pFiltroEmpresa||'';
  const filtroTipo = VIEW.pFiltroTipo||'';
  const filtroStatus = VIEW.pFiltroStatus||'';
  let pend = computePendencias();
  if(filtroEmpresa) pend = pend.filter(p=>p.empresaId===filtroEmpresa);
  if(filtroTipo) pend = pend.filter(p=>p.tipo===filtroTipo);
  if(filtroStatus) pend = pend.filter(p=>p.status===filtroStatus);
  pend.sort((a,b)=> (a.status==='Urgente'?0:1) - (b.status==='Urgente'?0:1));
  const tipos = [...new Set(computePendencias().map(p=>p.tipo))];
  const pendDia01 = computePendencias().filter(p=>p.actionType==='folha' || p.actionType==='distribuicao');

  return `
    <div class="pagehead">
      <div><h1>Central de pendências</h1><div class="sub">Visão consolidada de itens críticos e próximos vencimentos.</div></div>
      <button class="btn btn-primary" onclick="openModalPendencia()">+ Pendência manual</button>
    </div>
    <div class="panel">
      <h2>Lançamentos do dia 01 <span class="badge ${pendDia01.length?'badge-urgente':'badge-finalizado'}">${pendDia01.length}</span></h2>
      <p class="hint" style="margin-top:-6px;margin-bottom:12px;">Benefícios de valor variável (Reembolso Faculdade, Produtividade, Ajuda de Custo) e distribuições de lucro que ainda precisam ser lançados na folha desta competência. Some da lista assim que você clicar em "Lançar".</p>
      ${pendDia01.length===0?'<p class="hint">Nada pendente para lançar nesta competência.</p>':renderPendTable(pendDia01, false)}
    </div>
    <div class="filterbar">
      <select onchange="setFiltroPend('empresa',this.value)"><option value="">Todas as empresas</option>${DATA.empresas.map(e=>`<option value="${e.id}" ${filtroEmpresa===e.id?'selected':''}>${esc(e.nomeFantasia)}</option>`).join('')}</select>
      <select onchange="setFiltroPend('tipo',this.value)"><option value="">Todos os tipos</option>${tipos.map(t=>`<option ${filtroTipo===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
      <select onchange="setFiltroPend('status',this.value)"><option value="">Todos os status</option>${['Urgente','Aberta'].map(s=>`<option ${filtroStatus===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <div class="panel">${renderPendTable(pend, true)}</div>
    <div class="panel">
      <h2>Próximos vencimentos — recarga de VT</h2>
      <ul class="checklist" style="border-top:1px solid var(--line-soft);">
      ${proximasRecargasVT().map(r=>`<li><span class="cl-label">${esc(r.empregado)} — ${esc(r.empresa)}</span><span class="mono" style="font-size:12px;color:var(--ink-soft);">dia ${r.dia}</span></li>`).join('') || '<li class="hint">Nenhuma recarga programada.</li>'}
      </ul>
    </div>
  `;
}
function setFiltroPend(which,val){
  if(which==='empresa') VIEW.pFiltroEmpresa=val;
  else if(which==='tipo') VIEW.pFiltroTipo=val;
  else VIEW.pFiltroStatus=val;
  renderMain();
}
function renderPendTable(pend, allowDelete){
  if(pend.length===0) return `<p class="hint">Nenhuma pendência encontrada.</p>`;
  return `<table><thead><tr><th>Status</th><th>Empresa</th><th>Tipo</th><th>Descrição</th><th>Prazo</th><th></th></tr></thead><tbody>
    ${pend.map(p=>{
      const e = empresaById(p.empresaId);
      const dleft = p.prazo?daysUntil(p.prazo):null;
      let actionHtml = '';
      if(p.actionType==='folha'){
        actionHtml = `<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();launchBenefFolha('${p.actionEmpregadoId}','${p.actionKey}')">Lançar</button>`;
      }else if(p.actionType==='distribuicao'){
        actionHtml = `<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();launchDistribuicaoLucro('${p.actionSocioId}')">Lançar</button>`;
      }else if(allowDelete && !p.auto){
        actionHtml = `<button class="icon-btn" onclick="event.stopPropagation();deletePendManual('${p.id}')">✕</button>`;
      }
      return `<tr class="clickable" onclick="${p.empregadoId?`go('empregadoDetail',{empregadoId:'${p.empregadoId}',empresaId:'${p.empresaId}',empregadoTab:'dados'})`:(p.empresaId?`go('empresaDetail',{empresaId:'${p.empresaId}',empresaTab:'pendencias'})`:'')}">
        <td>${badge(p.status)}</td><td>${esc(e?e.nomeFantasia:'—')}</td><td>${esc(p.tipo)}</td><td>${esc(p.descricao)}</td>
        <td class="mono">${p.prazo?dateBR(p.prazo)+(dleft!==null?` <span style="color:${dleft<0?'var(--brick)':'var(--slate)'}">(${dleft<0?Math.abs(dleft)+'d atraso':dleft+'d'})</span>`:''):'—'}</td>
        <td>${actionHtml}</td>
      </tr>`;
    }).join('')}
  </tbody></table>`;
}
function openModalPendencia(){
  showModal(`
    <h3>Nova pendência manual</h3>
    <form onsubmit="return savePendencia(event)">
      <div class="formgrid">
        <div class="field full"><label>Empresa</label><select name="empresaId" required>${DATA.empresas.map(e=>`<option value="${e.id}">${esc(e.nomeFantasia)}</option>`).join('')}</select></div>
        <div class="field"><label>Tipo</label><input required name="tipo" placeholder="Ex: Documento, Solicitação..."></div>
        <div class="field"><label>Status</label><select name="status">${['Aberta','Urgente'].map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div class="field full"><label>Descrição</label><textarea required name="descricao"></textarea></div>
        <div class="field"><label>Prazo</label><input type="date" name="prazo"></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div>
    </form>
  `);
}
function savePendencia(ev){
  ev.preventDefault();
  const vals = Object.fromEntries(new FormData(ev.target).entries());
  DATA.pendenciasManuais.push(Object.assign({id:newId('p'), empregadoId:null}, vals));
  persist(); closeModal(); toast('Pendência registrada.'); render();
  return false;
}
function deletePendManual(id){
  if(!confirm('Remover esta pendência?')) return;
  DATA.pendenciasManuais = DATA.pendenciasManuais.filter(p=>p.id!==id); persist(); render();
}

/* ============================= DOCUMENTOS (GLOBAL) ============================= */
function viewDocumentos(){
  const empDocs = DATA.documentosEmpresa.map(d=>Object.assign({}, d, {origem:'Empresa', origemNome:(empresaById(d.empresaId)||{}).nomeFantasia}));
  const funcDocs = [];
  DATA.empregados.forEach(f=> (f.documentos||[]).forEach(d=> funcDocs.push(Object.assign({}, d, {origem:'Empregado', origemNome:f.nome, empresaId:f.empresaId}))));
  const all = [...empDocs, ...funcDocs].sort((a,b)=> a.data<b.data?1:-1);
  return `
    <div class="pagehead"><div><h1>Documentos</h1><div class="sub">Todos os anexos — empresas e empregados.</div></div></div>
    <div class="panel">
      <table><thead><tr><th>Arquivo</th><th>Categoria</th><th>Vinculado a</th><th>Empresa</th><th>Data</th></tr></thead><tbody>
      ${all.map(d=>{
        const e = empresaById(d.empresaId);
        return `<tr><td><strong>${esc(d.nome)}</strong></td><td>${esc(d.categoria)}</td><td>${d.origem} — ${esc(d.origemNome)}</td><td>${esc(e?e.nomeFantasia:'—')}</td><td class="mono">${dateBR(d.data)}</td></tr>`;
      }).join('') || `<tr class="empty-row"><td colspan="5">Nenhum documento anexado ainda.</td></tr>`}
      </tbody></table>
    </div>
  `;
}

/* ============================= MODAL SHELL ============================= */
function showModal(html, wide){
  const bd = document.createElement('div');
  bd.className='modal-backdrop'; bd.id='modalBackdrop';
  bd.onclick = (e)=>{ if(e.target===bd) closeModal(); };
  bd.innerHTML = `<div class="modal ${wide?'wide':''}">${html}</div>`;
  document.body.appendChild(bd);
  document.addEventListener('keydown', escCloser);
}
function escCloser(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const bd = document.getElementById('modalBackdrop');
  if(bd) bd.remove();
  document.removeEventListener('keydown', escCloser);
}

/* ============================= INIT ============================= */
render();
</script>
</body>
</html>
